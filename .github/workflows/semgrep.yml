name: Semgrep Security Scan

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  sast:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: downitch/secflows/.github/workflows/semgrep.yml@main
